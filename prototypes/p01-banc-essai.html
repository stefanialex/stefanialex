<title>Engueulade Générale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,700;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --pap:#E7EAE0; --feuille:#F4F5EF; --feuille2:#DDE1D4;
  --ink:#202318; --dim:#6E7464; --line:#C4C9B8; --line2:#A5AC95;
  --acc:#5C3D99; --acc-pale:#5C3D9916;
  --hot:#B03A2B; --ok:#3F6B4A; --or:#A8823C;

  /* la scène est un décor : même look dans les deux thèmes */
  --scene:#1D2318; --scene2:#161B12; --sol:#2A3122; --scene-ink:#DDE3CF;
  --papier-fig:#EDE6D2; --trait:#23261D;

  --slab:"Zilla Slab",Rockwell,Georgia,serif;
  --serif:"Spectral",Georgia,serif;
  --mono:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pap:#14170E; --feuille:#1C1F16; --feuille2:#252A1D;
  --ink:#E4E7DA; --dim:#949A86; --line:#333828; --line2:#4A5138;
  --acc:#B79BF2; --acc-pale:#B79BF21F;
  --hot:#E38874; --ok:#7FB08D; --or:#C9A25A;
}}
:root[data-theme="dark"]{
  --pap:#14170E; --feuille:#1C1F16; --feuille2:#252A1D;
  --ink:#E4E7DA; --dim:#949A86; --line:#333828; --line2:#4A5138;
  --acc:#B79BF2; --acc-pale:#B79BF21F;
  --hot:#E38874; --ok:#7FB08D; --or:#C9A25A;
}
*{box-sizing:border-box}
body{
  background:var(--pap);color:var(--ink);margin:0;
  font-family:var(--serif);font-size:16px;line-height:1.55;
  padding-inline:14px;padding-block:0 26px;
  -webkit-font-smoothing:antialiased;
}
.jeu{max-width:900px;margin:0 auto}

/* ---------- barre ---------- */
.barre{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  padding-block:16px 12px;border-bottom:2px solid var(--line2);
}
.barre h1{font-family:var(--slab);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.barre h1 em{font-style:normal;color:var(--acc)}
.cpts{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.cpts b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.vitesse{display:flex;gap:0;border:1px solid var(--line2)}
.vitesse button{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:0;border-left:1px solid var(--line2);
  color:var(--dim);padding:5px 9px;cursor:pointer;
}
.vitesse button:first-child{border-left:0}
.vitesse button[aria-pressed="true"]{background:var(--acc);color:var(--pap)}

/* ---------- frise d'initiative ---------- */
.frise{display:flex;gap:6px;align-items:center;margin:12px 0 8px;overflow-x:auto;padding-bottom:2px}
.frise .et{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap;margin-right:4px}
.jeton{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--feuille);color:var(--dim);
  padding:3px 8px;white-space:nowrap;
}
.jeton.moi{border-color:var(--acc);color:var(--acc);background:var(--acc-pale)}
.jeton.now{background:var(--acc);color:var(--pap);border-color:var(--acc);font-weight:700}
.jeton.ko{opacity:.32;text-decoration:line-through}

/* ---------- scène ---------- */
.scene{
  position:relative;background:var(--scene);
  background-image:radial-gradient(120% 90% at 50% 8%, #2A3122 0%, var(--scene) 55%, var(--scene2) 100%);
  border:1px solid var(--trait);
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:360px;padding:52px 12px 0;
}
@media (max-width:560px){.scene{min-height:330px;padding-top:44px}}
.scene::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:34px;
  background:var(--sol);border-top:1px solid #3A422F;
}
.camp{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,3vw,26px)}
.camp.adv{margin-bottom:20px}
.camp.nous{margin-bottom:26px}

.fig{
  position:relative;background:none;border:0;padding:0;margin:0;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:default;width:clamp(52px,15vw,84px);transition:transform .14s ease;
}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .nomfig{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--scene-ink);
  opacity:.72;white-space:nowrap;
}
.fig .pvmini{width:100%;height:4px;background:#0000004d;border:1px solid #ffffff1f}
.fig .pvmini i{display:block;height:100%;background:var(--papier-fig)}
.fig.ko{opacity:.34}
.fig.ko svg{transform:rotate(-82deg) translateY(12%)}
.fig.actif{transform:translateY(-7px)}
.fig.actif .nomfig{opacity:1;color:#fff}
.fig.visable{cursor:pointer}
.fig.visable svg{filter:drop-shadow(0 0 0 transparent)}
.fig.visable::before{
  content:"";position:absolute;inset:-6px -4px 14px;border:2px dashed var(--acc);
  border-radius:3px;pointer-events:none;
}
.fig.visable:hover,.fig.visable:focus-visible{transform:translateY(-5px);outline:none}
.fig.frappe{animation:secousse .3s ease}
.fig.charge{animation:charge .34s ease}
@keyframes secousse{0%,100%{transform:translateX(0)}22%{transform:translateX(-5px)}55%{transform:translateX(4px)}78%{transform:translateX(-2px)}}
@keyframes charge{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px) scale(1.04)}}

/* chiffres flottants */
.vol{
  position:absolute;z-index:6;font-family:var(--slab);font-weight:700;font-size:22px;
  color:var(--papier-fig);text-shadow:0 1px 0 #000;pointer-events:none;
  animation:monte 1.05s ease-out forwards;
}
.vol.deg{color:#F0846E}
.vol.crit{color:#FFB44A;font-size:29px}
.vol.soin{color:#8FD6A2}
.vol.rou{color:#E9A0F0;font-size:16px}
.vol.rate{color:#C9CFBB;font-size:15px;font-family:var(--mono);letter-spacing:.06em}
@keyframes monte{0%{opacity:0;transform:translateY(6px)}18%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}

/* bulle */
.bulle{
  position:absolute;z-index:8;left:50%;transform:translateX(-50%);
  bottom:calc(100% + 12px);width:max-content;max-width:min(300px,78vw);
  background:var(--papier-fig);color:var(--trait);border:2px solid var(--trait);
  padding:9px 12px;font-family:var(--serif);font-size:15px;line-height:1.42;
  box-shadow:3px 3px 0 #00000038;
}
.bulle b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--acc);margin-bottom:3px;font-weight:700}
.bulle::after{
  content:"";position:absolute;top:100%;left:50%;margin-left:-8px;
  border:8px solid transparent;border-top-color:var(--trait);
}
.bulle.gauche{left:0;transform:none}
.bulle.droite{left:auto;right:0;transform:none}
.bulle.droite::after{left:auto;right:18px;margin-left:0}
.bulle.gauche::after{left:18px;margin-left:0}

/* bandeau de phase */
.phase{
  position:absolute;top:0;left:0;right:0;z-index:5;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--scene-ink);opacity:.7;padding:9px 12px;
  display:flex;justify-content:space-between;gap:12px;
}
.phase b{color:#fff;opacity:1;font-weight:700}

/* couche d'avancement */
.avance{position:fixed;inset:0;z-index:20;cursor:pointer;background:transparent}
.hint{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:21;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--acc);color:var(--pap);padding:7px 14px;pointer-events:none;
}

/* ---------- HUD ---------- */
.equipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px}
@media (max-width:620px){.equipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.carte{background:var(--feuille);border:1px solid var(--line);padding:8px 9px 9px}
.carte.actif{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.carte.ko{opacity:.42}
.carte .n{font-family:var(--slab);font-weight:700;font-size:14px;line-height:1.1;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.carte .n i{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.carte .lab{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:6px;display:flex;justify-content:space-between}
.carte .lab b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--feuille2);border:1px solid var(--line);margin-top:2px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.bar.r i{background:var(--hot)}
.bar.r.chaud{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.carte .etat{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);min-height:1.1em;margin-top:5px}

/* ---------- actions ---------- */
.actions{border:1px solid var(--line2);background:var(--feuille);padding:11px 12px;margin-top:9px;min-height:86px}
.actions .titre{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.actions .titre b{color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:7px}
button.act{
  font-family:var(--slab);font-size:14.5px;font-weight:500;text-align:left;
  background:var(--feuille2);color:var(--ink);border:1px solid var(--line2);
  padding:8px 12px;cursor:pointer;flex:1 1 200px;
}
button.act span{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.02em;margin-top:2px}
button.act:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
button.act:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.act:disabled{opacity:.34;cursor:not-allowed}
button.act.primaire{background:var(--acc);color:var(--pap);border-color:var(--acc)}
button.act.primaire span{color:#ffffffc7}
button.act.primaire:hover{color:var(--pap);opacity:.9}

/* ---------- journal ---------- */
details.jr{margin-top:10px;border:1px solid var(--line);background:var(--feuille)}
details.jr summary{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);padding:9px 12px;cursor:pointer;
}
details.jr[open] summary{border-bottom:1px solid var(--line)}
.jrc{max-height:240px;overflow-y:auto;padding:10px 12px}
.l{margin:0 0 7px;font-size:15px}
.l:last-child{margin-bottom:0}
.l .sp{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:block}
.l.sys{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.l.sys b{color:var(--ink);font-weight:400}
.l.hot{font-family:var(--mono);font-size:11.5px;color:var(--hot)}
.l.ok{font-family:var(--mono);font-size:11.5px;color:var(--ok)}

/* ---------- modale ---------- */
.voile{position:fixed;inset:0;z-index:30;background:#0d0f0ac9;display:flex;align-items:center;justify-content:center;padding:16px}
.boite{background:var(--feuille);border:2px solid var(--acc);max-width:560px;width:100%;padding:18px;max-height:88vh;overflow-y:auto}
.boite h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:0 0 14px;font-weight:700}
.boite .ech{margin:0 0 15px}
.boite .btns{flex-direction:column}
.boite .btns button{flex:1 1 auto;width:100%}
.fin dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-family:var(--mono);font-size:12.5px;margin:0 0 15px}
.fin dt{color:var(--dim)}
.fin dd{margin:0;font-variant-numeric:tabular-nums}
.crit{border-top:1px solid var(--line);padding-top:12px;font-size:14.5px;color:var(--dim);line-height:1.55}
.crit b{color:var(--ink)}
.avis{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.7;border:1px dashed var(--line2);padding:10px 12px;margin:12px 0 0}
.avis b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="jeu">
  <div class="barre">
    <h1>Banc d'essai <em>01</em> — l'Engueulade</h1>
    <div class="cpts">
      <span>tour <b id="cTour">1</b></span>
      <span>engueulades <b id="cEng">0</b></span>
      <span>ratés <b id="cRate">0</b></span>
    </div>
    <div class="vitesse" role="group" aria-label="Rythme">
      <button id="vM" aria-pressed="false">Manuel</button>
      <button id="vN" aria-pressed="true">Normal</button>
      <button id="vR" aria-pressed="false">Rapide</button>
    </div>
  </div>

  <div class="frise" id="frise"></div>

  <div class="scene" id="scene">
    <div class="phase"><span id="phG">—</span><span id="phD"></span></div>
    <div class="camp adv" id="adv"></div>
    <div class="camp nous" id="nous"></div>
  </div>

  <div class="equipe" id="equipe"></div>

  <div class="actions">
    <div class="titre" id="titre">—</div>
    <div class="btns" id="btns"></div>
  </div>

  <details class="jr">
    <summary>Journal du combat — tout est consigné</summary>
    <div class="jrc" id="journal"></div>
  </details>

  <p class="avis"><b>Prototype jetable.</b> Il ne teste qu'une chose : <b>l'Engueulade est-elle amusante ?</b>
  Jouez trois combats, puis demandez-vous si vous avez rouvert le journal pour relire une réplique.</p>
</div>

<div id="couche"></div>
<div id="modale"></div>

const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ================= figures ================= */

/* ================= données ================= */
const HEROS=[

/* ================= rythme ================= */
let mode='normal',resoudre=null,minuteur=null;
function duree(txt){const b=1500+(txt?txt.length*40:0);return mode==='rapide'?b*.55:b}
function attendre(ms){
  return new Promise(res=>{
    resoudre=res;
    $('couche').innerHTML='<div class="avance" id="avc"></div><div class="hint">clic pour avancer</div>';
    $('avc').onclick=avancer;
    if(mode!=='manuel')minuteur=setTimeout(avancer,Math.min(ms,6000));
  });
}
function avancer(){
  if(!resoudre)return;
  clearTimeout(minuteur);$('couche').innerHTML='';
  const r=resoudre;resoudre=null;r();
}
addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&resoudre){e.preventDefault();avancer();}});
function setMode(m){
  mode=m;
  [['vM','manuel'],['vN','normal'],['vR','rapide']].forEach(([id,v])=>$(id).setAttribute('aria-pressed',String(v===m)));
}
$('vM').onclick=()=>setMode('manuel');$('vN').onclick=()=>setMode('normal');$('vR').onclick=()=>setMode('rapide');

/* ================= affichage ================= */
function el(u){return document.querySelector(`[data-u="${u.id}"]`)}
function flotte(u,txt,cls){
  const f=el(u);if(!f)return;
  const d=document.createElement('div');d.className='vol '+cls;d.textContent=txt;
  d.style.left='50%';d.style.top='6px';d.style.transform='translateX(-50%)';
  f.appendChild(d);setTimeout(()=>d.remove(),1100);
}
function anim(u,cls){const f=el(u);if(!f||RM)return;f.classList.add(cls);setTimeout(()=>f.classList.remove(cls),360);}
function bulleVide(){document.querySelectorAll('.bulle').forEach(b=>b.remove())}
async function dit(u,txt){
  bulleVide();
  const f=el(u);
  if(f){
    const b=document.createElement('div');b.className='bulle';
    const i=[...f.parentNode.children].indexOf(f),n=f.parentNode.children.length;
    if(n>2&&i===0)b.classList.add('gauche');if(n>2&&i===n-1)b.classList.add('droite');
    b.innerHTML=`<b>${u.nom}</b>${txt}`;f.appendChild(b);
  }
  log('',`<span class="sp">${u.nom}</span>${txt}`);
  await attendre(duree(txt));
  bulleVide();
}
function bark(ev,u){const p=BARKS[ev]&&BARKS[ev][u.id];return p?dit(u,pick(p)):Promise.resolve()}

function figure(u,visable,onclick){
  const b=document.createElement(visable?'button':'div');
  b.className='fig'+(u.mort?' ko':'')+(S.actif===u?' actif':'')+(visable?' visable':'');
  b.dataset.u=u.id;
  b.innerHTML=FIG[u.fig||u.id]+
    `<div class="pvmini"><i style="width:${Math.max(0,u.pv/u.pvm*100)}%"></i></div>
     <div class="nomfig">${u.nom}${u.proc?' · P'+u.proc:''}${u.etourdi?' · étourdi':''}${u.convoque?' · convoqué':''}</div>`;
  if(visable)b.onclick=onclick;
  return b;
}
function rendre(visables,cb){
  $('adv').innerHTML='';S.ennemis.forEach(e=>$('adv').appendChild(figure(e,visables==='ennemi'&&!e.mort,()=>cb(e))));
  $('nous').innerHTML='';S.heros.forEach(h=>$('nous').appendChild(figure(h,visables==='allie'&&!h.mort&&h!==S.actif,()=>cb(h))));
  $('equipe').innerHTML='';
  S.heros.forEach(h=>{
    const d=document.createElement('div');
    d.className='carte'+(h.mort?' ko':'')+(S.actif===h?' actif':'');
    d.innerHTML=`<div class="n">${h.nom}<i>rang ${h.rang}</i></div>
      <div class="lab"><span>PV</span><b>${h.pv}/${h.pvm}</b></div><div class="bar"><i style="width:${Math.max(0,h.pv/h.pvm*100)}%"></i></div>
      <div class="lab"><span>Rouspétance</span><b>${h.rousp}</b></div><div class="bar r${h.rousp>=75?' chaud':''}"><i style="width:${h.rousp}%"></i></div>
      <div class="lab"><span>${h.res}</span><b>${h.resv}</b></div>
      <div class="etat">${h.parti?'démissionnaire':h.buff?'remonté':h.comp?'complice':h.coal?'coalisé':h.mort?'à terre':''}</div>`;
    $('equipe').appendChild(d);
  });
  $('cTour').textContent=S.tour;$('cEng').textContent=S.nbEng;$('cRate').textContent=S.nbRate;
  const fr=$('frise');fr.innerHTML='<span class="et">Ordre</span>';
  S.file.forEach((u,i)=>{
    const j=document.createElement('span');
    j.className='jeton'+(u.rang?' moi':'')+(u===S.actif?' now':'')+(u.mort?' ko':'');
    j.textContent=u.nom;fr.appendChild(j);
  });
}
function phase(g,d){$('phG').innerHTML=g;$('phD').innerHTML=d||''}

/* ================= règles ================= */
function rousp(h,n){if(h.mort)return;const av=h.rousp;h.rousp=Math.max(0,Math.min(100,h.rousp+n));
  if(n>0&&h.rousp!==av)flotte(h,'+'+n+' rousp.','rou');}
function echec(){S.nbRate++;S.serie=(S.serie||0)+1;const f=S.heros.find(h=>h.id==='flo');if(f&&!f.mort)f.resv=Math.min(f.resmax,f.resv+1);}
function degats(h,n){let m=1;if(S.buffG)m*=S.buffG.dmg;if(h.buff>0)m*=1.35;if(h.coal>0)m*=1.5;return Math.max(1,Math.round(n*m))}

async function frapper(h,e,n,critable=true){
  anim(h,'charge');await attendre(RM?120:240);
  const crit=critable&&(h.critG||Math.random()<.12);if(h.critG)h.critG=0;
  let d=degats(h,n);if(crit)d=Math.round(d*1.8);
  S.serie=0;e.pv=Math.max(0,e.pv-d);
  anim(e,'frappe');flotte(e,'−'+d,crit?'crit':'deg');
  log('sys',`${h.nom} → ${e.nom} : <b>${d}</b>${crit?' (critique)':''}`);
  rendre();await attendre(700);
  if(crit){rousp(h,-15);await bark('crit',h);}
  if(e.pv<=0&&!e.mort){e.mort=true;rousp(h,-10);log('ok',`${e.nom} est hors de combat.`);rendre();await bark('tue',h);
    if(Math.random()<.45){const o=pick(S.heros.filter(a=>!a.mort&&a!==h));if(o)await bark('fouille',o);}}
}
async function rater(h,e){
  anim(h,'charge');flotte(e||h,'RATÉ','rate');
  log('hot',`${h.nom} rate ${e?e.nom:'sa cible'}.`);
  rousp(h,12);echec();S.heros.forEach(a=>{if(a!==h&&!a.mort)rousp(a,4)});
  rendre();await attendre(560);await bark('rate',h);
  if((S.serie||0)>=3){S.serie=0;const o=pick(S.heros.filter(a=>!a.mort&&a!==h));if(o)await bark('poisse',o);}
}
async function chute(u){
  if(u.pv>0||u.mort)return;
  u.mort=true;log('hot',`<b>${u.nom}</b> est à terre.`);rendre();
  if(BARKS.mort[u.id])await dit(u,BARKS.mort[u.id]);
  S.heros.forEach(a=>{if(!a.mort)rousp(a,20)});echec();rendre();
}

/* ================= tour du joueur ================= */
function choisir(h){
  return new Promise(res=>{
    $('titre').innerHTML=`Au tour de <b>${h.nom}</b> — ${h.cls} · ${h.res} ${h.resv}`;
    const z=$('btns');z.innerHTML='';
    CAPA[h.id].forEach(c=>{
      const ok=(c.k||0)<=h.resv&&(!c.si||c.si(h));
      const b=document.createElement('button');b.className='act';
      b.innerHTML=`${c.n}<span>${c.d}${c.k?' · coût '+c.k:''}</span>`;b.disabled=!ok;
      b.onclick=()=>{
        if(c.c==='auto')return res({c,cible:null});
        $('titre').innerHTML=`<b>${c.n}</b> — choisissez une cible sur la scène`;
        z.innerHTML='';
        const an=document.createElement('button');an.className='act';an.textContent='Annuler';
        an.onclick=()=>{rendre();res(choisir(h))};z.appendChild(an);
        rendre(c.c,cible=>{rendre();res({c,cible})});
      };
      z.appendChild(b);
    });
  });
}
async function executer(h,c,cible){
  h.resv=Math.max(0,h.resv-(c.k||0));
  if(h.id==='gue'){
    if(c.n==='Coup de bouclier'){
      if(Math.random()<.78+(S.buffG?S.buffG.prec:0)){
        await frapper(h,cible,rnd(5,8));
        if(Math.random()<.25&&!cible.mort){cible.etourdi=1;log('ok',`${cible.nom} est étourdi.`);rendre();}
      }else await rater(h,cible);
    }else{
      const r=h.resv;h.resv=0;log('sys',`Rancune dépensée : <b>${r}</b>.`);
      if(Math.random()<.78)await frapper(h,cible,3+4*r);else await rater(h,cible);
    }
  }else if(h.id==='beu'){
    if(c.n==='Signification'){
      if(Math.random()<.78){await frapper(h,cible,rnd(3,6));if(!cible.mort)await proc(cible,1);}
      else await rater(h,cible);
    }else{await proc(cible,2);}
  }else if(h.id==='odo'){
    if(c.n==='Petit sort de rien du tout'){
      await frapper(h,cible,rnd(2,4),false);h.resv=Math.min(h.resmax,h.resv+1);
    }else{
      if(Math.random()<.5+.05*h.resv){await frapper(h,cible,rnd(8,14));h.resv=Math.min(h.resmax,h.resv+1);}
      else{
        h.resv=0;const v=pick(S.heros.filter(a=>!a.mort&&a!==h))||h;
        anim(h,'charge');await attendre(240);
        v.pv=Math.max(0,v.pv-6);anim(v,'frappe');flotte(v,'−6','deg');
        log('hot',`Retour de flamme : <b>${v.nom}</b> prend 6.`);
        rousp(v,25);rousp(h,12);echec();rendre();await attendre(700);
        await bark('retour',h);await chute(v);
      }
    }
  }else{
    if(c.n==='Remarque appuyée'){
      cible.buff=2;rousp(cible,15);
      log('sys',`<b>${cible.nom}</b> : +35 % de dégâts pendant 2 tours.`);rendre();
      await dit(h,pick(["Vas-y, montre-nous. Pour une fois.","Ce n'est pas un compliment. Mais fais-en quelque chose.","Je ne te crois pas capable. Prouve-moi le contraire."]));
    }else{
      const t=S.heros.filter(a=>!a.mort&&a!==h).sort((a,b)=>b.rousp-a.rousp).slice(0,2);
      t.forEach(a=>rousp(a,25));S.oriente=true;rendre();
      log('sys',`Engueulade orientée vers <b>${t.map(x=>x.nom).join('</b> et <b>')}</b>.`);
      await dit(h,"Je ne déclenche rien. Je mets juste les gens en présence.");
    }
  }
}
async function proc(e,n){
  e.proc+=n;log('sys',`${e.nom} : Procédure <b>${e.proc}/3</b>.`);flotte(e,'+'+n+' proc.','rou');rendre();
  if(e.proc>=3){e.proc=0;e.convoque=1;log('ok',`${e.nom} est convoqué : il perd son tour.`);rendre();}
  await attendre(520);
}

/* ================= tour adverse ================= */
async function jouerGobelin(e){
  const vis=S.heros.filter(h=>!h.mort&&h.parti===0);if(!vis.length)return;
  if(Math.random()<.3)await dit(e,pick(BARKS.gob));
  const c=pick(vis.flatMap(h=>Array(Math.max(1,5-h.rang)).fill(h)));
  anim(e,'charge');await attendre(RM?120:260);
  if(Math.random()<.74-(S.esq?.15:0)){
    const crit=Math.random()<.12;let d=rnd(5,9);if(crit)d=Math.round(d*1.8);
    c.pv=Math.max(0,c.pv-d);anim(c,'frappe');flotte(c,'−'+d,crit?'crit':'deg');
    log('sys',`${e.nom} → ${c.nom} : <b>${d}</b>${crit?' (critique)':''}`);
    if(crit)rousp(c,15);
    if(c.id==='gue')c.resv=Math.min(c.resmax,c.resv+1);
    if(c.comp){const o=S.heros.find(h=>h.id===c.comp);
      if(o&&!o.mort){const p=Math.round(d/2);o.pv=Math.max(0,o.pv-p);c.pv=Math.min(c.pvm,c.pv+p);
      log('sys','Complices : les dégâts sont partagés.');flotte(o,'−'+p,'deg');}}
    rendre();await attendre(700);
    await chute(c);
    if(!c.mort&&c.pv<c.pvm*.3&&Math.random()<.45)await bark('bas',c);
  }else{
    flotte(c,'ESQUIVE','rate');log('sys',`${e.nom} rate ${c.nom}.`);rendre();await attendre(560);
  }
}

/* ================= engueulade ================= */
function modale(html,cb){
  $('modale').innerHTML=`<div class="voile"><div class="boite">${html}</div></div>`;
  $('modale').querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b));
  const f=$('modale').querySelector('button');if(f)f.focus();
}
function choixModale(html){return new Promise(res=>modale(html,b=>res(b.dataset.c)))}
async function engueulade(a){
  const autres=S.heros.filter(h=>!h.mort&&h!==a&&h.parti===0).sort((x,y)=>y.rousp-x.rousp);
  if(!autres.length){a.rousp=40;return}
  const b=autres[0];S.nbEng++;
  phase('<b>Engueulade générale</b>','tout s’arrête');
  log('hot','— ENGUEULADE GÉNÉRALE —');rendre();
  const l1=pick(ENG_A[a.id]).replace('%s',b.nom),l2=pick(ENG_B[b.id]);
  await dit(a,l1);await dit(b,l2);
  const c=await choixModale(`
    <h3>Engueulade générale</h3>
    <div class="ech">
      <p class="l"><span class="sp">${a.nom}</span>${l1}</p>
      <p class="l"><span class="sp">${b.nom}</span>${l2}</p>
    </div>
    <div class="btns">
      <button class="act" data-c="a">Prendre parti pour ${a.nom}<span>${a.nom} : rouspétance à 0, +25 % de dégâts 2 tours. ${b.nom} reste à 60.</span></button>
      <button class="act" data-c="b">Prendre parti pour ${b.nom}<span>${b.nom} : rouspétance à 0, +25 % de dégâts 2 tours. ${a.nom} reste à 60.</span></button>
      <button class="act primaire" data-c="x">« Vos gueules »<span>Les deux retombent à 40, et on tire sur la table d8.${S.oriente?' Engueulade orientée : une relance disponible.':''}</span></button>
    </div>`);
  S.choix.push(c);$('modale').innerHTML='';
  if(c!=='x'){
    const g=c==='a'?a:b,p=c==='a'?b:a;
    g.rousp=0;g.buff=2;p.rousp=60;rendre();
    log('sys',`Le joueur prend parti pour <b>${g.nom}</b>.`);
    await dit(p,pick(ENG_B[p.id]));
  }else{
    a.rousp=40;b.rousp=40;await tirer(a,b,S.oriente);
  }
}
async function tirer(a,b,relance){
  const i=rnd(0,7),r=D8[i];
  const c=await choixModale(`
    <h3>Résultat — d8 : ${i+1}</h3>
    <div class="ech">
      <p class="l" style="font-family:var(--slab);font-size:20px;font-weight:700">${r.n}</p>
      <p class="l">${r.t}</p>
    </div>
    <div class="btns">
      ${relance?'<button class="act" data-c="r">Relancer<span>Florimond avait préparé le terrain. Une seule fois.</span></button>':''}
      <button class="act primaire" data-c="ok">Accepter</button>
    </div>`);
  $('modale').innerHTML='';
  if(c==='r'){S.oriente=false;return tirer(a,b,false)}
  r.f(S,a,b);log('hot',`d8 → <b>${r.n}</b>. ${r.t}`);rendre();
}

/* ================= boucle ================= */
async function boucle(){
  while(!S.fini){
    S.heros.forEach(h=>{
      if(h.parti>0){h.parti--;if(!h.parti&&!h.mort){h.pv=h.pvm;log('sys',`<b>${h.nom}</b> revient. Il a une note de frais.`)}}
      if(h.coal>0)h.coal--;if(h.buff>0)h.buff--;
    });
    if(S.buffG&&--S.buffG.t<=0)S.buffG=null;
    if(S.esq>0)S.esq--;
    const v=[...S.heros.filter(h=>!h.mort&&!h.parti),...S.ennemis.filter(e=>!e.mort)];
    S.file=v.map(u=>({u,i:rnd(1,10)+(u.rang?6-u.rang:3)})).sort((x,y)=>y.i-x.i).map(x=>x.u);

    for(const u of S.file){
      if(S.fini)return;
      if(S.ennemis.every(e=>e.mort))return fin(true);
      if(S.heros.every(h=>h.mort))return fin(false);
      const d=S.heros.find(h=>!h.mort&&h.rousp>=100&&!h.parti);
      if(d)await engueulade(d);
      if(u.mort||u.parti)continue;
      S.actif=u;rendre();
      if(u.saute){u.saute--;phase(`Tour ${S.tour}`,`${u.nom} boude`);log('sys',`<b>${u.nom}</b> boude et passe son tour.`);await attendre(900);continue}
      if(u.etourdi){u.etourdi--;phase(`Tour ${S.tour}`,`${u.nom} est étourdi`);await attendre(900);continue}
      if(u.convoque){u.convoque--;phase(`Tour ${S.tour}`,`${u.nom} est convoqué`);log('sys',`<b>${u.nom}</b> est ailleurs.`);await attendre(900);continue}
      if(u.rang){
        phase(`Tour ${S.tour}`,`au tour de <b>${u.nom}</b>`);
        const {c,cible}=await choisir(u);
        $('btns').innerHTML='';$('titre').textContent='…';
        await executer(u,c,cible);
      }else{
        phase(`Tour ${S.tour}`,'tour adverse');$('titre').textContent='Tour adverse…';$('btns').innerHTML='';
        await jouerGobelin(u);
      }
      S.actif=null;rendre();
    }
    S.tour++;
  }
}
function fin(gagne){
  if(S.fini)return;S.fini=true;S.actif=null;rendre();$('couche').innerHTML='';
  phase(gagne?'<b>Salle vidée</b>':'<b>Repli</b>','');
  log(gagne?'ok':'hot',gagne?'Salle vidée. Il reste à rédiger le rapport.':'Le groupe se replie. Personne ne dit rien sur le chemin du retour.');
  const vg=S.choix.filter(c=>c==='x').length,pp=S.choix.length-vg;
  modale(`<h3>${gagne?'Fin de mission':'Repli'}</h3><div class="fin"><dl>
    <dt>Tours joués</dt><dd>${S.tour}</dd>
    <dt>Engueulades</dt><dd>${S.nbEng}</dd>
    <dt>« Vos gueules »</dt><dd>${vg}</dd>
    <dt>Partis pris</dt><dd>${pp}</dd>
    <dt>Attaques ratées</dt><dd>${S.nbRate}</dd>
    <dt>Survivants</dt><dd>${S.heros.filter(h=>!h.mort).length}/4</dd></dl>
    <p class="crit"><b>Critère du banc d'essai.</b> Avez-vous rouvert le journal pour relire une réplique ?
    Si la réponse est non après trois combats, la mécanique ne porte pas le jeu : on ne l'ajuste pas, on la remplace.</p></div>
    <div class="btns"><button class="act primaire" data-c="go">Relancer un combat</button></div>`,()=>{$('modale').innerHTML='';init()});
}
init();
</script>
