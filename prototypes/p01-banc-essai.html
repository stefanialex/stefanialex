<title>Donjon &amp; Paperasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,700;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --pap:#E7EAE0; --feuille:#F4F5EF; --feuille2:#DDE1D4;
  --ink:#202318; --dim:#6E7464; --line:#C4C9B8; --line2:#A5AC95;
  --acc:#5C3D99; --acc-pale:#5C3D9916;
  --hot:#B03A2B; --ok:#3F6B4A; --or:#A8823C;
  --slab:"Zilla Slab",Rockwell,Georgia,serif;
  --serif:"Spectral",Georgia,serif;
  --mono:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pap:#14170E; --feuille:#1C1F16; --feuille2:#252A1D;
  --ink:#E4E7DA; --dim:#949A86; --line:#333828; --line2:#4A5138;
  --acc:#B79BF2; --acc-pale:#B79BF21F; --hot:#E38874; --ok:#7FB08D; --or:#C9A25A;
}}
:root[data-theme="dark"]{
  --pap:#14170E; --feuille:#1C1F16; --feuille2:#252A1D;
  --ink:#E4E7DA; --dim:#949A86; --line:#333828; --line2:#4A5138;
  --acc:#B79BF2; --acc-pale:#B79BF21F; --hot:#E38874; --ok:#7FB08D; --or:#C9A25A;
}
*{box-sizing:border-box}
body{
  background:var(--pap);color:var(--ink);margin:0;
  font-family:var(--serif);font-size:16px;line-height:1.55;
  padding-inline:14px;padding-block:0 26px;-webkit-font-smoothing:antialiased;
}
.jeu{max-width:1180px;margin:0 auto}
@media (min-width:1600px){.jeu{max-width:1340px}}

/* ---------- barre ---------- */
.barre{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  padding-block:16px 12px;border-bottom:2px solid var(--line2)}
.barre h1{font-family:var(--slab);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.barre h1 em{font-style:normal;color:var(--acc)}
.ident{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.barre h1{font-family:var(--slab);font-size:22px;font-weight:700;margin:0;letter-spacing:-.015em}
.barre .etape{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line2);padding:3px 7px;white-space:nowrap}

.cpts{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.cpts b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.vitesse{display:flex;border:1px solid var(--line2)}
.vitesse button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:0;border-left:1px solid var(--line2);color:var(--dim);padding:5px 9px;cursor:pointer}
.vitesse button:first-child{border-left:0}
.vitesse button[aria-pressed="true"]{background:var(--acc);color:var(--pap)}

/* ---------- frise ---------- */
.frise{display:flex;gap:6px;align-items:center;margin:12px 0 8px;overflow-x:auto;padding-bottom:2px}
.frise .et{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap;margin-right:4px}
.jeton{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;border:1px solid var(--line);
  background:var(--feuille);color:var(--dim);padding:3px 8px;white-space:nowrap;transition:all .2s}
.jeton.moi{border-color:var(--acc);color:var(--acc);background:var(--acc-pale)}
.jeton.now{background:var(--acc);color:var(--pap);border-color:var(--acc);font-weight:700}
.jeton.ko{opacity:.3;text-decoration:line-through}

/* ================= SCÈNE ================= */
.scene{
  position:relative;isolation:isolate;border:1px solid #11140D;
  background:linear-gradient(#20261A,#161A11 62%,#0F1209);
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:clamp(330px,54vh,680px);padding:54px clamp(12px,2vw,28px) 0;
}
@media (max-width:620px){.scene{min-height:330px;padding-top:46px}}
.decor{position:absolute;inset:0;z-index:0;overflow:hidden}
.decor svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:max(100%,760px);height:100%;display:block}
.lueur{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(38% 46% at 16% 34%, #FFB05433 0%, transparent 70%),
    radial-gradient(38% 46% at 84% 34%, #FFB05426 0%, transparent 70%),
    radial-gradient(90% 60% at 50% 104%, #FFD9A01F 0%, transparent 72%);
  mix-blend-mode:screen;
}
.vign{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, transparent 42%, #05060399 100%)}
.brume{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.5}
.brume i{position:absolute;width:3px;height:3px;border-radius:50%;background:#E8D9B0;opacity:.35;
  animation:poussiere linear infinite}
@keyframes poussiere{0%{transform:translateY(0) translateX(0);opacity:0}
  12%{opacity:.4}88%{opacity:.25}100%{transform:translateY(-190px) translateX(22px);opacity:0}}

.camp{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,3vw,52px)}
.camp.adv{margin-bottom:clamp(20px,4vh,56px)}
.camp.nous{margin-bottom:clamp(26px,5vh,66px)}

.fig{position:relative;background:none;border:0;padding:0;margin:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:default;width:clamp(56px,8.6vw,132px);transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.corps{position:relative;width:100%;animation:respire 4.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.fig svg.perso{display:block;width:100%;height:auto;overflow:visible;
  filter:drop-shadow(0 3px 5px #00000066)}
.ombre{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  width:76%;height:9px;border-radius:50%;background:#00000073;filter:blur(2.5px);z-index:-1}
@keyframes respire{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(.5deg)}}

.plaque{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.pvmini{width:84%;height:5px;background:#00000080;border:1px solid #ffffff26;border-radius:1px;overflow:hidden}
.pvmini i{display:block;height:100%;background:linear-gradient(#F2EAD2,#C9BF9E);transition:width .3s ease}
.pvmini.bas i{background:linear-gradient(#F0846E,#B8402F)}
.nomfig{font-family:var(--mono);font-size:clamp(9.5px,.75vw,12px);letter-spacing:.06em;color:#DDE3CF;opacity:.7;white-space:nowrap;text-shadow:0 1px 2px #000}
.etq{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:#FFC96B;min-height:1em;text-shadow:0 1px 2px #000}

.fig.ko{opacity:.42}
.fig.ko .corps{animation:none;transform:rotate(-80deg) translate(-16%,14%)}
.fig.actif{transform:translateY(-9px)}
.fig.actif .nomfig{opacity:1;color:#fff}
.fig.actif::after{content:"";position:absolute;top:-14px;left:50%;margin-left:-6px;
  border:6px solid transparent;border-top-color:#FFC96B;animation:pointe 1.1s ease-in-out infinite}
@keyframes pointe{50%{transform:translateY(4px)}}
.fig.visable{cursor:pointer}
.fig.visable::before{content:"";position:absolute;inset:-8px -6px 10px;border:2px dashed #C3A6FF;
  border-radius:4px;pointer-events:none;animation:halo 1.4s ease-in-out infinite}
@keyframes halo{50%{opacity:.4}}
.fig.visable:hover,.fig.visable:focus-visible{transform:translateY(-6px);outline:none}
.corps.chargeG{animation:chargeG .38s cubic-bezier(.3,1.4,.4,1)}
.corps.chargeD{animation:chargeD .38s cubic-bezier(.3,1.4,.4,1)}
.corps.touche{animation:touche .34s ease}
@keyframes chargeG{0%,100%{transform:translate(0,0)}40%{transform:translate(-14px,-10px) rotate(-7deg)}}
@keyframes chargeD{0%,100%{transform:translate(0,0)}40%{transform:translate(14px,-10px) rotate(7deg)}}
@keyframes touche{0%{transform:translateX(0)}18%{transform:translateX(-7px) rotate(-3deg)}
  45%{transform:translateX(6px) rotate(2deg)}72%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.fig.flash svg.perso{filter:drop-shadow(0 3px 5px #00000066) brightness(3.4) saturate(0)}
.scene.secousse{animation:sec .32s ease}
@keyframes sec{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}
  50%{transform:translate(4px,-3px)}75%{transform:translate(-2px,1px)}}

.eclat{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:clamp(78px,6vw,120px);height:clamp(78px,6vw,120px);
  pointer-events:none;z-index:7;animation:eclat .42s ease-out forwards}
@keyframes eclat{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0deg)}
  25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(22deg)}}

.vol{position:absolute;left:50%;top:4px;z-index:9;font-family:var(--slab);font-weight:700;font-size:clamp(25px,1.9vw,36px);
  color:#F2EAD2;text-shadow:0 2px 0 #000,0 0 10px #0009;pointer-events:none;white-space:nowrap;
  animation:monte 1.15s cubic-bezier(.2,.8,.3,1) forwards}
.vol.deg{color:#FF9A80}
.vol.crit{color:#FFC24A;font-size:clamp(34px,2.6vw,50px);text-shadow:0 2px 0 #000,0 0 16px #FFA02699}
.vol.soin{color:#97DFA8}
.vol.rou{color:#E9A0F0;font-size:16px;font-family:var(--mono);letter-spacing:.04em}
.vol.rate{color:#CBD2BD;font-size:15px;font-family:var(--mono);letter-spacing:.1em}
@keyframes monte{0%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),10px) scale(.6)}
  22%{opacity:1;transform:translate(calc(-50% + var(--dx,0px)),-8px) scale(1.12)}
  38%{transform:translate(calc(-50% + var(--dx,0px)),-14px) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px) * 2),-52px) scale(.95)}}

/* bulle */
.bulle{position:absolute;z-index:12;left:50%;transform:translateX(-50%);
  bottom:calc(100% + 16px);width:max-content;max-width:min(380px,80vw);
  background:linear-gradient(#F6F0DC,#EAE2C8);color:#23261D;border:2px solid #23261D;border-radius:2px;
  padding:10px 13px 11px;font-family:var(--serif);font-size:clamp(15.5px,1.05vw,18px);line-height:1.45;
  box-shadow:4px 5px 0 #00000059;animation:pop .16s ease-out}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.96)}}
.bulle .qui{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#5C3D99;margin-bottom:4px;font-weight:700}
.bulle .qui svg{width:20px;height:20px;overflow:visible;flex:0 0 auto}
.bulle .txt::after{content:"▍";color:#5C3D99;animation:curseur .7s steps(1) infinite}
.bulle.fini .txt::after{content:""}
@keyframes curseur{50%{opacity:0}}
.bulle::after{content:"";position:absolute;top:100%;left:50%;margin-left:-9px;
  border:9px solid transparent;border-top-color:#23261D}
.bulle.gauche{left:-6px;transform:none;animation:none}
.bulle.droite{left:auto;right:-6px;transform:none;animation:none}
.bulle.gauche::after{left:24px;margin-left:0}
.bulle.droite::after{left:auto;right:24px;margin-left:0}

/* bandeaux */
.phase{position:absolute;top:0;left:0;right:0;z-index:5;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#DDE3CF;opacity:.72;padding:10px 13px;
  display:flex;justify-content:space-between;gap:12px;text-shadow:0 1px 3px #000}
.phase b{color:#fff;opacity:1;font-weight:700}
.annonce{position:absolute;left:0;right:0;top:38%;z-index:14;pointer-events:none;
  background:#0E120Ae6;border-top:1px solid #FFC96B66;border-bottom:1px solid #FFC96B66;
  padding:11px 16px;font-family:var(--slab);font-weight:700;font-size:19px;color:#F6F0DC;
  text-align:center;letter-spacing:.02em;animation:balayage 1s ease forwards}
@keyframes balayage{0%{opacity:0;clip-path:inset(0 50% 0 50%)}18%{opacity:1;clip-path:inset(0 0 0 0)}
  74%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}

/* couche d'avancement */
.avance{position:fixed;inset:0;z-index:20;cursor:pointer;background:transparent}
.hint{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:21;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--acc);color:var(--pap);padding:7px 14px;pointer-events:none;
  box-shadow:0 3px 12px #0000004d}

/* ---------- HUD ---------- */
.bas{display:grid;gap:9px;margin-top:9px;align-items:start}
@media (min-width:1024px){
  .bas{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
  .bas .equipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bas .actions{height:100%}
}
.equipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:0}
@media (max-width:660px){.equipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.carte{background:var(--feuille);border:1px solid var(--line);padding:8px 9px 9px;
  display:grid;grid-template-columns:34px 1fr;gap:0 9px;transition:border-color .2s}
.carte.actif{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.carte.ko{opacity:.42}
.carte .vig{grid-row:1/4;align-self:start;background:#1D2318;border:1px solid var(--line2);padding:2px}
.carte .vig svg{display:block;width:100%;height:auto;overflow:visible}
.carte .n{font-family:var(--slab);font-weight:700;font-size:14px;line-height:1.1;
  display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.carte .n i{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.carte .zone{grid-column:2}
.lab{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-top:5px;display:flex;justify-content:space-between}
.lab b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--feuille2);border:1px solid var(--line);margin-top:2px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s cubic-bezier(.2,.8,.3,1)}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 9px,#0000001f 9px 10px)}
.bar.r i{background:linear-gradient(90deg,#C9793C,var(--hot))}
.bar.r.chaud i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.carte .etat{grid-column:2;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--acc);min-height:1.1em;margin-top:5px}

/* ---------- actions ---------- */
.actions{border:1px solid var(--line2);background:var(--feuille);padding:11px 12px;margin-top:0;min-height:90px}
.actions .titre{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.actions .titre b{color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:7px}
button.act{font-family:var(--slab);font-size:14.5px;font-weight:500;text-align:left;
  background:var(--feuille2);color:var(--ink);border:1px solid var(--line2);
  padding:9px 12px;cursor:pointer;flex:1 1 210px;transition:all .14s}
button.act span{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
button.act:hover:not(:disabled){border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
button.act:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.act:disabled{opacity:.34;cursor:not-allowed}
button.act.primaire{background:var(--acc);color:var(--pap);border-color:var(--acc)}
button.act.primaire span{color:#ffffffc7}
button.act.primaire:hover{color:var(--pap);opacity:.9}

/* ---------- journal ---------- */
details.jr{margin-top:10px;border:1px solid var(--line);background:var(--feuille)}
details.jr summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);padding:9px 12px;cursor:pointer}
details.jr[open] summary{border-bottom:1px solid var(--line)}
.jrc{max-height:clamp(220px,32vh,420px);overflow-y:auto;padding:10px 12px}
.l{margin:0 0 7px;font-size:15px}
.l:last-child{margin-bottom:0}
.l .sp{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:block}
.l.sys{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.l.sys b{color:var(--ink);font-weight:400}
.l.hot{font-family:var(--mono);font-size:11.5px;color:var(--hot)}
.l.ok{font-family:var(--mono);font-size:11.5px;color:var(--ok)}

/* ---------- modale ---------- */
.voile{position:fixed;inset:0;z-index:30;background:#0d0f0ad9;display:flex;align-items:center;justify-content:center;padding:16px}
.boite{background:var(--feuille);border:2px solid var(--acc);max-width:570px;width:100%;padding:18px;
  max-height:88vh;overflow-y:auto;box-shadow:0 18px 50px #00000066;animation:pop2 .18s ease-out}
@keyframes pop2{0%{opacity:0;transform:translateY(10px) scale(.98)}}
.boite h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:0 0 14px;font-weight:700}
.boite .ech{margin:0 0 15px}
.boite .btns{flex-direction:column}
.boite .btns button{flex:1 1 auto;width:100%}
.fin dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-family:var(--mono);font-size:12.5px;margin:0 0 15px}
.fin dt{color:var(--dim)}
.fin dd{margin:0;font-variant-numeric:tabular-nums}
.crit{border-top:1px solid var(--line);padding-top:12px;font-size:14.5px;color:var(--dim);line-height:1.55}
.crit b{color:var(--ink)}
.avis{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.7;border:1px dashed var(--line2);padding:10px 12px;margin:12px 0 0}
.avis b{color:var(--ink)}

/* ---------- rapport ---------- */
.champ{margin:0 0 12px}
.champ label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.champ input,.champ textarea,.champ select{
  width:100%;font-family:var(--serif);font-size:15px;color:var(--ink);
  background:var(--pap);border:1px solid var(--line2);padding:8px 10px;border-radius:0}
.champ textarea{min-height:64px;resize:vertical}
.champ input:focus,.champ textarea:focus,.champ select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.04em;text-transform:none;color:var(--ink);border:1px solid var(--line2);
  padding:6px 10px;cursor:pointer;margin:0}
.radios input{width:auto}
.rap{width:100%;min-height:210px;font-family:var(--mono);font-size:12px;line-height:1.55;
  background:var(--pap);color:var(--ink);border:1px solid var(--line2);padding:10px;resize:vertical}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="jeu">
  <div class="barre">
    <div class="ident">
      <h1>Donjon <em>&amp;</em> Paperasse</h1>
      <span class="etape">banc d'essai 01 · l'engueulade</span>
    </div>
    <div class="cpts">
      <span>tour <b id="cTour">1</b></span>
      <span>engueulades <b id="cEng">0</b></span>
      <span>ratés <b id="cRate">0</b></span>
    </div>
    <div class="vitesse" role="group" aria-label="Rythme">
      <button id="vM" aria-pressed="false">Manuel</button>
      <button id="vN" aria-pressed="true">Normal</button>
      <button id="vR" aria-pressed="false">Rapide</button>
    </div>
  </div>

  <div class="frise" id="frise"></div>

  <div class="scene" id="scene">
    <div class="decor" id="decor"></div>
    <div class="lueur"></div>
    <div class="brume" id="brume"></div>
    <div class="phase"><span id="phG">—</span><span id="phD"></span></div>
    <div class="camp adv" id="adv"></div>
    <div class="camp nous" id="nous"></div>
    <div class="vign"></div>
    <div id="annonce"></div>
  </div>

  <div class="bas">
    <div class="equipe" id="equipe"></div>
    <div class="actions">

/* ================= rythme ================= */
let mode='normal',resoudre=null,minuteur=null,finTexte=null,journalOuvert=false;
function duree(t){const b=900+(t?t.length*22:0);return mode==='rapide'?b*.55:b}
function attendre(ms){
  return new Promise(res=>{
    resoudre=res;
    $('couche').innerHTML='<div class="avance" id="avc"></div><div class="hint">clic pour avancer</div>';
    $('avc').onclick=avancer;
    if(mode!=='manuel')minuteur=setTimeout(avancer,Math.min(ms,6000));
  });
}
function avancer(){if(!resoudre)return;clearTimeout(minuteur);$('couche').innerHTML='';
  const r=resoudre;resoudre=null;r();}
addEventListener('keydown',e=>{
  if(e.key!==' '&&e.key!=='Enter')return;
  if(finTexte){e.preventDefault();return finTexte();}
  if(resoudre){e.preventDefault();avancer();}
});
function setMode(m){mode=m;[['vM','manuel'],['vN','normal'],['vR','rapide']]
  .forEach(([i,v])=>$(i).setAttribute('aria-pressed',String(v===m)));}
$('vM').onclick=()=>setMode('manuel');$('vN').onclick=()=>setMode('normal');$('vR').onclick=()=>setMode('rapide');

function machine(bulle,txt){
  const n=bulle.querySelector('.txt');
  return new Promise(res=>{
    if(RM){n.textContent=txt;bulle.classList.add('fini');return res()}
    let i=0;const v=mode==='rapide'?9:21;
    $('couche').innerHTML='<div class="avance" id="avc"></div>';
    const fin=saute=>{clearInterval(t);finTexte=null;n.textContent=txt;bulle.classList.add('fini');
      if(saute&&S)S.sautees++;$('couche').innerHTML='';res()};
    finTexte=()=>fin(true);$('avc').onclick=()=>fin(true);
    const t=setInterval(()=>{n.textContent=txt.slice(0,++i);if(i>=txt.length)fin(false)},v);
  });
}

  $('journal').appendChild(p);$('journal').scrollTop=$('journal').scrollHeight}

/* ================= effets ================= */
function el(u){return document.querySelector(`[data-u="${u.id}"]`)}
function corps(u){const f=el(u);return f&&f.querySelector('.corps')}
function flotte(u,txt,cls){
  const f=el(u);if(!f)return;
  const d=document.createElement('div');d.className='vol '+cls;d.textContent=txt;
  d.style.setProperty('--dx',rnd(-16,16)+'px');
  f.appendChild(d);setTimeout(()=>d.remove(),1200);
}
function lance(u,vers){
  const c=corps(u);if(!c||RM)return;
  const a=el(u).getBoundingClientRect(),b=vers?el(vers).getBoundingClientRect():null;
  const g=b?b.left<a.left:false;
  const k=g?'chargeG':'chargeD';c.classList.add(k);setTimeout(()=>c.classList.remove(k),400);
}
function impact(u,crit){
  const c=corps(u),f=el(u);if(!c||!f)return;
  if(!RM){c.classList.add('touche');setTimeout(()=>c.classList.remove('touche'),360);
    f.classList.add('flash');setTimeout(()=>f.classList.remove('flash'),90);
    const e=document.createElement('div');e.className='eclat';
    e.innerHTML=`<svg viewBox="0 0 100 100"><g fill="${crit?'#FFC24A':'#FFE9B0'}" stroke="#1B1E15" stroke-width="2.5" stroke-linejoin="round">
      <path d="M50 2 L60 36 L94 30 L66 52 L88 80 L54 68 L46 98 L38 66 L8 78 L30 50 L4 26 L40 34 Z"/></g></svg>`;
    f.appendChild(e);setTimeout(()=>e.remove(),450);
    if(crit){$('scene').classList.add('secousse');setTimeout(()=>$('scene').classList.remove('secousse'),340)}
  }
}
function annonce(txt){
  const z=$('annonce');z.innerHTML=`<div class="annonce">${txt}</div>`;
  setTimeout(()=>z.innerHTML='',RM?200:1000);
  return dodo(RM?150:820);
}
function bulleVide(){document.querySelectorAll('.bulle').forEach(b=>b.remove())}
async function dit(u,txt){
  bulleVide();
  const f=el(u);let b=null;
  if(f){
    b=document.createElement('div');b.className='bulle';
    const i=[...f.parentNode.children].indexOf(f),n=f.parentNode.children.length;
    if(n>2&&i===0)b.classList.add('gauche');if(n>2&&i===n-1)b.classList.add('droite');
    b.innerHTML=`<div class="qui">${FIG[u.fig||u.id]}${u.nom}</div><span class="txt"></span>`;
    f.appendChild(b);
  }
  log('',`<span class="sp">${u.nom}</span>${txt}`);S.lignes++;
  if(b)await machine(b,txt);
  await attendre(duree(txt));
  bulleVide();
}
function bark(ev,u){const p=BARKS[ev]&&BARKS[ev][u.id];return p?dit(u,pick(p)):Promise.resolve()}

      <div class="lab"><span>Rouspétance</span><b>${h.rousp}</b></div><div class="bar r${h.rousp>=75?' chaud':''}"><i style="width:${h.rousp}%"></i></div>

/* ================= règles ================= */
function rousp(h,n){if(h.mort)return;const a=h.rousp;h.rousp=Math.max(0,Math.min(100,h.rousp+n));
  if(n>0&&h.rousp!==a)flotte(h,'+'+n+' rousp.','rou')}
function echec(){S.nbRate++;S.serie=(S.serie||0)+1;
  const f=S.heros.find(h=>h.id==='flo');if(f&&!f.mort)f.resv=Math.min(f.resmax,f.resv+1)}
function degats(h,n){let m=1;if(S.buffG)m*=S.buffG.dmg;if(h.buff>0)m*=1.35;if(h.coal>0)m*=1.5;
  return Math.max(1,Math.round(n*m))}

async function frapper(h,e,n,critable=true){
  lance(h,e);await dodo(RM?80:190);
  const crit=critable&&(h.critG||Math.random()<.12);if(h.critG)h.critG=0;
  let d=degats(h,n);if(crit)d=Math.round(d*1.8);
  S.serie=0;e.pv=Math.max(0,e.pv-d);
  impact(e,crit);flotte(e,'−'+d,crit?'crit':'deg');
  log('sys',`${h.nom} → ${e.nom} : <b>${d}</b>${crit?' (critique)':''}`);
  await dodo(crit?120:60);rendre();await dodo(560);
  if(crit){rousp(h,-15);await bark('crit',h)}
  if(e.pv<=0&&!e.mort){e.mort=true;rousp(h,-10);log('ok',`${e.nom} est hors de combat.`);
    rendre();await dodo(360);await bark('tue',h);
    if(Math.random()<.45){const o=pick(S.heros.filter(a=>!a.mort&&a!==h));if(o)await bark('fouille',o)}}
}
async function rater(h,e){
  lance(h,e);await dodo(RM?80:190);
  flotte(e||h,'RATÉ','rate');log('hot',`${h.nom} rate ${e?e.nom:'sa cible'}.`);
  rousp(h,12);echec();S.heros.forEach(a=>{if(a!==h&&!a.mort)rousp(a,4)});
  rendre();await dodo(520);await bark('rate',h);
  if(S.serie>=3){S.serie=0;const o=pick(S.heros.filter(a=>!a.mort&&a!==h));if(o)await bark('poisse',o)}
}
async function chute(u){
  if(u.pv>0||u.mort)return;
  u.mort=true;log('hot',`<b>${u.nom}</b> est à terre.`);rendre();await dodo(400);
  if(BARKS.mort[u.id])await dit(u,BARKS.mort[u.id]);
  S.heros.forEach(a=>{if(!a.mort)rousp(a,20)});echec();rendre();
}
async function proc(e,n){
  e.proc=Math.min(3,e.proc+n);log('sys',`${e.nom} : Procédure <b>${e.proc}/3</b>.`);flotte(e,'+'+n+' proc.','rou');rendre();
  if(e.proc>=3){e.proc=0;e.convoque=1;log('ok',`${e.nom} est convoqué : il perd son tour.`);rendre();
    await dodo(400);const o=pick(S.heros.filter(a=>!a.mort));if(o)await bark('convoque',o);return}
  await dodo(480);
}

/* ================= tour du joueur ================= */
function choisir(h){
  return new Promise(res=>{
    $('titre').innerHTML=`Au tour de <b>${h.nom}</b> — ${h.cls} · ${h.res} ${h.resv}`;
    const z=$('btns');z.innerHTML='';
    CAPA[h.id].forEach(c=>{
      const ok=(c.k||0)<=h.resv&&(!c.si||c.si(h));
      const b=document.createElement('button');b.className='act';
      b.innerHTML=`${c.n}<span>${c.d}${c.k?' · coût '+c.k:''}</span>`;b.disabled=!ok;
      b.onclick=()=>{
        if(c.c==='auto')return res({c,cible:null});
        $('titre').innerHTML=`<b>${c.n}</b> — choisissez une cible sur la scène`;
        z.innerHTML='';
        const a=document.createElement('button');a.className='act';a.textContent='Annuler';
        a.onclick=()=>{rendre();res(choisir(h))};z.appendChild(a);
        rendre(c.c,cible=>{rendre();res({c,cible})});
      };
      z.appendChild(b);
    });
    /* Filet de sécurité : sans lui, un personnage sans ressource ni capacité
       gratuite bloque la partie en attendant une action impossible. */
    if(!CAPA[h.id].some(c=>(c.k||0)<=h.resv&&(!c.si||c.si(h)))){
      const b=document.createElement('button');b.className='act';
      b.innerHTML=`Passer le tour<span>Aucune option disponible.</span>`;
      b.onclick=()=>res({c:{n:'__passe',c:'auto',k:0},cible:null});
      z.appendChild(b);
    }
  });
}
async function executer(h,c,cible){
  if(c.n==='__passe'){log('sys',`<b>${h.nom}</b> ne fait rien. Il assume.`);await dodo(700);return}
  h.resv=Math.max(0,h.resv-(c.k||0));
  if(h.id==='gue'){
    if(c.n==='Coup de bouclier'){
      if(Math.random()<.78+(S.buffG?S.buffG.prec:0)){
        await frapper(h,cible,rnd(5,8));
        if(Math.random()<.25&&!cible.mort){cible.etourdi=1;log('ok',`${cible.nom} est étourdi.`);rendre()}
      }else await rater(h,cible);
    }else{
      const r=h.resv;h.resv=0;log('sys',`Rancune dépensée : <b>${r}</b>.`);
      if(Math.random()<.78)await frapper(h,cible,3+4*r);else await rater(h,cible);
    }
  }else if(h.id==='beu'){
    if(c.n==='Signification'){
      if(Math.random()<.78){await frapper(h,cible,rnd(3,6));if(!cible.mort)await proc(cible,1)}
      else await rater(h,cible);
    }else await proc(cible,2);
  }else if(h.id==='odo'){
    if(c.n==='Petit sort de rien du tout'){
      await frapper(h,cible,rnd(2,4),false);h.resv=Math.min(h.resmax,h.resv+1);
    }else{
      if(Math.random()<.5+.05*h.resv){await frapper(h,cible,rnd(8,14));h.resv=Math.min(h.resmax,h.resv+1)}
      else{
        h.resv=0;const v=pick(S.heros.filter(a=>!a.mort&&a!==h))||h;
        lance(h,v);await dodo(200);
        v.pv=Math.max(0,v.pv-6);impact(v,false);flotte(v,'−6','deg');
        log('hot',`Retour de flamme : <b>${v.nom}</b> prend 6.`);
        rousp(v,25);rousp(h,12);echec();rendre();await dodo(620);
        await bark('retour',h);await chute(v);
      }
    }
  }else{
    if(c.n==='Remarque de fond de salle'){
      if(Math.random()<.78+(S.buffG?S.buffG.prec:0)){
        await frapper(h,cible,rnd(2,5));h.resv=Math.min(h.resmax,h.resv+1);
      }else await rater(h,cible);
    }else if(c.n==='Remarque appuyée'){
      cible.buff=2;rousp(cible,15);
      log('sys',`<b>${cible.nom}</b> : +35 % de dégâts pendant 2 tours.`);rendre();
      await dit(h,pick(["Vas-y, montre-nous. Pour une fois.","Ce n'est pas un compliment. Mais fais-en quelque chose.","Je ne te crois pas capable. Prouve-moi le contraire."]));
    }else{
      const t=S.heros.filter(a=>!a.mort&&a!==h).sort((a,b)=>b.rousp-a.rousp).slice(0,2);
      t.forEach(a=>rousp(a,25));S.oriente=true;rendre();
      log('sys',`Engueulade orientée vers <b>${t.map(x=>x.nom).join('</b> et <b>')}</b>.`);
      await dit(h,"Je ne déclenche rien. Je mets juste les gens en présence.");
    }
  }
}

/* ================= tour adverse ================= */
async function jouerGobelin(e){
  const vis=S.heros.filter(h=>!h.mort&&h.parti===0);if(!vis.length)return;
  if(Math.random()<.3)await dit(e,pick(BARKS.gob));
  const c=pick(vis.flatMap(h=>Array(Math.max(1,5-h.rang)).fill(h)));
  lance(e,c);await dodo(RM?80:210);
  if(Math.random()<.74-(S.esq?.15:0)){
    const crit=Math.random()<.12;let d=rnd(5,9);if(crit)d=Math.round(d*1.8);
    c.pv=Math.max(0,c.pv-d);impact(c,crit);flotte(c,'−'+d,crit?'crit':'deg');
    log('sys',`${e.nom} → ${c.nom} : <b>${d}</b>${crit?' (critique)':''}`);
    if(crit)rousp(c,15);
    if(c.id==='gue')c.resv=Math.min(c.resmax,c.resv+1);
    let comp=null;
    if(c.comp){const o=S.heros.find(h=>h.id===c.comp);
      if(o&&!o.mort){const p=Math.round(d/2);o.pv=Math.max(0,o.pv-p);c.pv=Math.min(c.pvm,c.pv+p);
        log('sys','Complices : les dégâts sont partagés.');flotte(o,'−'+p,'deg');comp=o}}
    rendre();await dodo(620);await chute(c);if(comp)await chute(comp);
    if(!c.mort&&c.pv<c.pvm*.3&&Math.random()<.45)await bark('bas',c);
  }else{flotte(c,'ESQUIVE','rate');log('sys',`${e.nom} rate ${c.nom}.`);rendre();await dodo(520)}
}

/* ================= engueulade ================= */
function modale(html,cb){
  $('modale').innerHTML=`<div class="voile"><div class="boite">${html}</div></div>`;
  $('modale').querySelectorAll('button').forEach(b=>b.onclick=()=>cb(b));
  const f=$('modale').querySelector('button');if(f)f.focus();
}
const choixModale=h=>new Promise(r=>modale(h,b=>r(b.dataset.c)));
async function engueulade(a){
  const au=S.heros.filter(h=>!h.mort&&h!==a&&h.parti===0).sort((x,y)=>y.rousp-x.rousp);
  if(!au.length){a.rousp=40;return}
  const b=au[0];S.nbEng++;
  phase('<b>Engueulade générale</b>','tout s’arrête');rendre();
  await annonce('ENGUEULADE GÉNÉRALE');
  log('hot','— ENGUEULADE GÉNÉRALE —');
  const l1=pick(ENG_A[a.id]).replace('%s',b.nom),l2=pick(ENG_B[b.id]);
  await dit(a,l1);await dit(b,l2);
  const c=await choixModale(`
    <h3>Engueulade générale</h3>
    <div class="ech">
      <p class="l"><span class="sp">${a.nom}</span>${l1}</p>
      <p class="l"><span class="sp">${b.nom}</span>${l2}</p>
    </div>
    <div class="btns">
      <button class="act" data-c="a">Prendre parti pour ${a.nom}<span>${a.nom} : rouspétance à 0, +25 % de dégâts 2 tours. ${b.nom} reste à 60.</span></button>
      <button class="act" data-c="b">Prendre parti pour ${b.nom}<span>${b.nom} : rouspétance à 0, +25 % de dégâts 2 tours. ${a.nom} reste à 60.</span></button>
      <button class="act primaire" data-c="x">« Vos gueules »<span>Les deux retombent à 40, et on tire sur la table d8.${S.oriente?' Engueulade orientée : une relance disponible.':''}</span></button>
    </div>`);
  S.choix.push(c);$('modale').innerHTML='';
  if(c!=='x'){
    const g=c==='a'?a:b,p=c==='a'?b:a;
    g.rousp=0;g.buff=2;p.rousp=60;rendre();
    log('sys',`Le joueur prend parti pour <b>${g.nom}</b>.`);
    await dit(p,pick(ENG_B[p.id]));
  }else{a.rousp=40;b.rousp=40;await tirer(a,b,S.oriente)}
}
async function tirer(a,b,relance){
  const i=rnd(0,7),r=D8[i];
  const c=await choixModale(`
    <h3>Résultat — d8 : ${i+1}</h3>
    <div class="ech">
      <p class="l" style="font-family:var(--slab);font-size:20px;font-weight:700">${r.n}</p>
      <p class="l">${r.t}</p>
    </div>
    <div class="btns">
      ${relance?'<button class="act" data-c="r">Relancer<span>Florimond avait préparé le terrain. Une seule fois.</span></button>':''}
      <button class="act primaire" data-c="ok">Accepter</button>
    </div>`);
  $('modale').innerHTML='';
  if(c==='r'){S.oriente=false;return tirer(a,b,false)}
  r.f(S,a,b);log('hot',`d8 → <b>${r.n}</b>. ${r.t}`);rendre();await dodo(400);
}


/* ================= rapport d'incident ================= */
function rapport(gagne){
  const lus=S.lignes-S.sautees, pc=S.lignes?Math.round(lus/S.lignes*100):0;
  modale(`<h3>Rapport d'incident — à remplir en un exemplaire</h3>
    <div class="champ"><label>Nom de l'agent</label><input id="rNom" maxlength="30" placeholder="prénom, pseudo, matricule"></div>
    <div class="champ"><label>Sans rouvrir le journal : citez une réplique</label>
      <textarea id="rCit" maxlength="240" placeholder="même approximative — ou laissez vide si aucune ne revient"></textarea></div>
    <div class="champ"><label>À quel moment avez-vous décroché ?</label>
      <div class="radios">
        <label><input type="radio" name="rDec" value="jamais" checked> jamais</label>
        <label><input type="radio" name="rDec" value="dès le début"> dès le début</label>
        <label><input type="radio" name="rDec" value="au milieu"> au milieu</label>
        <label><input type="radio" name="rDec" value="vers la fin"> vers la fin</label>
      </div></div>
    <div class="champ"><label>Vous relanceriez une partie ?</label>
      <div class="radios">
        <label><input type="radio" name="rRej" value="oui" checked> oui</label>
        <label><input type="radio" name="rRej" value="non"> non</label>
        <label><input type="radio" name="rRej" value="peut-être"> peut-être</label>
      </div></div>
    <div class="champ"><label>Remarque libre (facultatif)</label>
      <input id="rRem" maxlength="180" placeholder="ce qui vous a gêné, ce qui vous a fait rire"></div>
    <div class="btns"><button class="act primaire" data-c="ok">Établir le rapport</button></div>`,
  async ()=>{
    const v=n=>document.querySelector(`input[name="${n}"]:checked`).value;
    const t=[
      "■ RAPPORT D'INCIDENT — DONJON & PAPERASSE (banc d'essai 01)",
      "Agent : "+((document.getElementById('rNom').value||'non renseigné').trim()),
      "Issue : "+(gagne?'salle vidée':'repli')+" · "+S.tour+" tours · "+Math.round((Date.now()-S.debut)/60000)+" min",
      "Engueulades : "+S.nbEng+"  (« vos gueules » : "+S.choix.filter(c=>c==='x').length+" · partis pris : "+(S.choix.length-S.choix.filter(c=>c==='x').length)+")",
      "Ratés : "+S.nbRate+" · Survivants : "+S.heros.filter(h=>!h.mort).length+"/4",
      "Répliques affichées : "+S.lignes+" — lues en entier : "+lus+" ("+pc+" %)",
      "Journal rouvert : "+(journalOuvert?'oui':'non')+" · Rythme : "+mode,
      "—",
      "Réplique citée : "+((document.getElementById('rCit').value||'AUCUNE').trim()),
      "Décrochage : "+v('rDec'),
      "Relancerait : "+v('rRej'),
      "Remarque : "+((document.getElementById('rRem').value||'—').trim()),
    ].join("\n");
    const brut={agent:(document.getElementById('rNom').value||'').trim(),
      issue:gagne?'victoire':'repli',tours:S.tour,minutes:Math.round((Date.now()-S.debut)/60000),
      engueulades:S.nbEng,vosGueules:S.choix.filter(c=>c==='x').length,
      partisPris:S.choix.length-S.choix.filter(c=>c==='x').length,
      rates:S.nbRate,survivants:S.heros.filter(h=>!h.mort).length,
      lignes:S.lignes,lues:lus,pourcentLues:pc,journal:journalOuvert,rythme:mode,
      citation:(document.getElementById('rCit').value||'').trim(),
      decrochage:v('rDec'),relancerait:v('rRej'),
      remarque:(document.getElementById('rRem').value||'').trim(),texte:t};
    /* Si la page est servie par un serveur à nous, on envoie le rapport tout seul.
       Sur claude.ai l'appel échoue sans bruit et on retombe sur le copier-coller. */
    let envoye=false;
    try{
      const r=await fetch('rapport',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(brut)});
      envoye=r.ok;
    }catch(e){}
    modale(`<h3>Rapport ${envoye?'transmis':'établi'}</h3>
      <p class="l" style="font-size:14.5px;margin-bottom:10px">${envoye
        ?'Le rapport a été transmis au service compétent. Vous n\'avez plus rien à faire.'
        :'Copiez ce bloc et collez-le dans le salon Discord. C\'est tout.'}</p>
      <textarea class="rap" id="rTxt" readonly>${t.replace(/</g,'&lt;')}</textarea>
      <div class="btns" style="margin-top:12px">
        <button class="act primaire" data-c="cp">Copier le rapport</button>
        <button class="act" data-c="go">Relancer un combat</button></div>`,
    b=>{
      if(b.dataset.c==='cp'){
        const z=document.getElementById('rTxt');z.focus();z.select();
        let ok=false;
        try{ok=document.execCommand('copy')}catch(e){}
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(t).then(()=>{b.textContent='Copié'},()=>{});
        b.textContent=ok?'Copié':'Sélectionné — Ctrl/Cmd + C';
        return;
      }
      $('modale').innerHTML='';init();
    });
  });
}

/* ================= boucle ================= */
async function boucle(){
  while(!S.fini){
    S.heros.forEach(h=>{
      if(h.parti>0){h.parti--;if(!h.parti&&!h.mort){h.pv=h.pvm;log('sys',`<b>${h.nom}</b> revient. Il a une note de frais.`)}}
      if(h.coal>0)h.coal--;if(h.buff>0)h.buff--;
    });
    if(S.buffG&&--S.buffG.t<=0)S.buffG=null;
    if(S.esq>0)S.esq--;
    const v=[...S.heros.filter(h=>!h.mort&&!h.parti),...S.ennemis.filter(e=>!e.mort)];
    S.file=v.map(u=>({u,i:rnd(1,10)+(u.rang?6-u.rang:3)})).sort((x,y)=>y.i-x.i).map(x=>x.u);
    if(S.tour>1)await annonce('Tour '+S.tour);

    for(const u of S.file){
      if(S.fini)return;
      if(S.ennemis.every(e=>e.mort))return fin(true);
      if(S.heros.every(h=>h.mort))return fin(false);
      const d=S.heros.find(h=>!h.mort&&h.rousp>=100&&!h.parti);
      if(d)await engueulade(d);
      if(u.mort||u.parti)continue;
      S.actif=u;rendre();
      if(u.saute){u.saute--;phase(`Tour ${S.tour}`,`${u.nom} boude`);log('sys',`<b>${u.nom}</b> boude et passe son tour.`);await dodo(700);
        if(Math.random()<.5){const o=pick(S.heros.filter(a=>!a.mort&&a!==u));if(o)await bark('attente',o)}continue}
      if(u.etourdi){u.etourdi--;phase(`Tour ${S.tour}`,`${u.nom} est étourdi`);await dodo(850);continue}
      if(u.convoque){u.convoque--;phase(`Tour ${S.tour}`,`${u.nom} est convoqué`);log('sys',`<b>${u.nom}</b> est ailleurs.`);await dodo(850);continue}
      if(u.rang){
        phase(`Tour ${S.tour}`,`au tour de <b>${u.nom}</b>`);
        const {c,cible}=await choisir(u);
        $('btns').innerHTML='';$('titre').textContent='…';
        await executer(u,c,cible);
      }else{
        phase(`Tour ${S.tour}`,'tour adverse');$('titre').textContent='Tour adverse…';$('btns').innerHTML='';
        await jouerGobelin(u);
      }
      S.actif=null;rendre();
    }
    S.tour++;
  }
}
async function fin(gagne){
  if(S.fini)return;S.fini=true;S.actif=null;rendre();$('couche').innerHTML='';bulleVide();
  phase(gagne?'<b>Salle vidée</b>':'<b>Repli</b>','');
  log(gagne?'ok':'hot',gagne?'Salle vidée. Il reste à rédiger le rapport.':'Le groupe se replie. Personne ne dit rien sur le chemin du retour.');
  if(gagne){const h=pick(S.heros.filter(x=>!x.mort));if(h)await bark('victoire',h)}
  else{const e=S.ennemis.find(x=>!x.mort);if(e)await dit(e,pick(BARKS.defaite))}
  bulleVide();$('couche').innerHTML='';
  const vg=S.choix.filter(c=>c==='x').length,pp=S.choix.length-vg;
  modale(`<h3>${gagne?'Fin de mission':'Repli'}</h3><div class="fin"><dl>
    <dt>Tours joués</dt><dd>${S.tour}</dd>
    <dt>Engueulades</dt><dd>${S.nbEng}</dd>
    <dt>« Vos gueules »</dt><dd>${vg}</dd>
    <dt>Partis pris</dt><dd>${pp}</dd>
    <dt>Attaques ratées</dt><dd>${S.nbRate}</dd>
    <dt>Survivants</dt><dd>${S.heros.filter(h=>!h.mort).length}/4</dd></dl>
    <p class="crit"><b>Critère du banc d'essai.</b> Journal fermé : pouvez-vous citer une réplique ?
    Si personne n'en retient une seule après trois combats, la mécanique ne porte pas le jeu — on ne l'ajuste pas, on la remplace.</p></div>
    <div class="btns">
      <button class="act primaire" data-c="rap">Remplir le rapport d'incident<span>Deux minutes. C'est la seule donnée qui compte.</span></button>
      <button class="act" data-c="go">Relancer un combat</button></div>`,
    b=>{if(b.dataset.c==='rap')return rapport(gagne);$('modale').innerHTML='';init()});
}
document.querySelector('details.jr').addEventListener('toggle',e=>{if(e.target.open)journalOuvert=true});
init();
</script>
